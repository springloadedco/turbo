name: kit

on:
  push:
    branches: [main]
    paths:
      - 'kit/**'
      - '.github/workflows/kit.yml'
  pull_request:
    paths:
      - 'kit/**'
      - '.github/workflows/kit.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the kit under (e.g. 1.0). Consumers still reference the digest.'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump deliberately — the kit spec grammar the CLI accepts is tied to this.
  # v0.37.1 normalises schemaVersion "1" and rejects the current v2 grammar.
  SBX_VERSION: v0.37.1
  KIT_REPO: docker.io/springloadedco/turbo-kit

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install sbx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$SBX_VERSION" \
            --repo docker/sbx-releases \
            --pattern 'DockerSandboxes-linux-amd64.tar.gz' \
            --output sbx.tar.gz
          tar -xzf sbx.tar.gz
          echo "$PWD/docker-sbx" >> "$GITHUB_PATH"

      - name: Validate kit
        run: |
          sbx kit validate ./kit/
          sbx kit inspect ./kit/ --json > kit.json
          jq '.warnings' kit.json

      - name: Pack kit
        run: sbx kit pack ./kit/ -o turbo-kit.zip

  publish:
    # Only on a published release or an explicit dispatch — never on every main push.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install sbx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$SBX_VERSION" \
            --repo docker/sbx-releases \
            --pattern 'DockerSandboxes-linux-amd64.tar.gz' \
            --output sbx.tar.gz
          tar -xzf sbx.tar.gz
          echo "$PWD/docker-sbx" >> "$GITHUB_PATH"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Push kit
        id: push
        run: |
          set -o pipefail
          sbx kit push ./kit/ "${KIT_REPO}:${{ steps.tag.outputs.value }}" 2>&1 | tee push.log
          # Consumers must reference a digest — tags are rejected for remote kit refs.
          DIGEST=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Summarise
        run: |
          {
            echo "### Kit published"
            echo
            echo '```bash'
            if [ -n "${{ steps.push.outputs.digest }}" ]; then
              echo "sbx run --kit oci://${KIT_REPO}@${{ steps.push.outputs.digest }} turbo"
            else
              echo "# Digest not found in push output — read it from the job log."
              echo "sbx run --kit oci://${KIT_REPO}@sha256:<digest> turbo"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
