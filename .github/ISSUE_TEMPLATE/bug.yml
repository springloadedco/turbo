name: Bug Report
description: Report an issue with the Turbo kit, sandbox image, or skills
title: "[Bug]: "
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              We're sorry to hear you have a problem. Can you help us solve it by providing the following details.
    - type: dropdown
      id: area
      attributes:
          label: Which part of Turbo?
          options:
              - The kit (spec.yaml / network policy / sandbox creation)
              - The sandbox image (PHP, Node, Chromium, agent-browser)
              - Skills
              - Something else
      validations:
          required: true
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: What did you expect to happen?
          placeholder: I cannot currently do X thing because when I do, it breaks X thing.
      validations:
          required: true
    - type: textarea
      id: how-to-reproduce
      attributes:
          label: How to reproduce the bug
          description: Please include the exact command you ran and a reliable set of steps if possible.
          placeholder: sbx run --kit oci://docker.io/springloadedco/turbo-kit@sha256:… turbo
      validations:
          required: true
    - type: input
      id: kit-reference
      attributes:
          label: Kit reference
          description: The full `--kit` value you used, including the digest, or `./kit` if running from a local clone.
          placeholder: "oci://docker.io/springloadedco/turbo-kit@sha256:abc123…"
      validations:
          required: false
    - type: input
      id: sbx-version
      attributes:
          label: sbx version
          description: Output of `sbx version`.
          placeholder: v0.37.1
      validations:
          required: true
    - type: textarea
      id: policy-log
      attributes:
          label: Network policy log
          description: If anything failed to reach the network, paste `sbx policy log <sandbox>`.
          render: shell
      validations:
          required: false
    - type: dropdown
      id: operating-systems
      attributes:
          label: Which operating systems does this happen with?
          description: You may select more than one.
          multiple: true
          options:
              - macOS
              - Windows
              - Linux
    - type: textarea
      id: notes
      attributes:
          label: Notes
          description: Use this field to provide any other notes that you feel might be relevant to the issue.
      validations:
          required: false
